name: Telegram Bot CI

on:
  workflow_dispatch: # Hanya bisa dijalankan manual dari tab Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Bot akan mati otomatis setelah 30 menit agar hemat kuota

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          # Menyuntikkan Secret GitHub ke dalam Environment Variable Python
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot.py
