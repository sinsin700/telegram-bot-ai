name: Telegram Bot CI

on:
  workflow_dispatch: # Memungkinkan kamu menjalankan bot secara manual lewat tombol "Run workflow"
  push:
    branches: [ "main" ] # Jalankan otomatis jika ada push ke branch main

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # ⚠️ PENTING: Bot polling akan berjalan terus-menerus. 
    # Kita batasi maksimal 30 menit agar tidak memakan kuota GitHub Actions kamu.
    timeout-minutes: 30 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Gunakan versi Python yang stabil

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        # Di sini kita menyuntikkan secret ke dalam environment variable
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot.py
